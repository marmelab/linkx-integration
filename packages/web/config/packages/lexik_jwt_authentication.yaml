lexik_jwt_authentication:
  secret_key: "%env(resolve:JWT_SECRET_KEY)%"
  public_key: "%env(resolve:JWT_PUBLIC_KEY)%"
  pass_phrase: "%env(JWT_PASSPHRASE)%"
  user_id_claim: email
  token_extractors:
    split_cookie:
      enabled: true
      cookies:
        - jwt_hp
        - jwt_s

  set_cookies:
    # For mercure only. Does not work over http.
    __Secure-mercure_access_token:
      lifetime: 0
      samesite: strict
      path: /
      domain: null
      httpOnly: true
      partitioned: false
      secure: true

    # Readable by javascript, no signature
    jwt_hp:
      lifetime: null
      samesite: strict
      path: /
      domain: null
      httpOnly: false
      partitioned: false
      secure: false
      split:
        - header
        - payload

    # Signature, not readable by javascript
    jwt_s:
      lifetime: 0
      samesite: strict
      path: /
      domain: null
      httpOnly: true
      partitioned: false
      secure: false
      split:
        - signature
