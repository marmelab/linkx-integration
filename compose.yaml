---
services:
  node-linkx:
    build:
      context: .
      dockerfile: packages/cli/Dockerfile
    ports:
      - 3005:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://node-linkx:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  swagger-ui:
    depends_on:
      - node-linkx
    image: swaggerapi/swagger-ui
    container_name: "swagger-ui-container"
    ports:
      - "3080:8080"
    environment:
      SWAGGER_JSON_URL: "http://localhost:3005/"
  php:
    env_file:
      - .env
      - .env.local
      - packages/web/.env
      - packages/web/.env.local
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    environment:
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-http://${DEFAULT_URI:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
      MERCURE_EXTRA_DIRECTIVES: cors_origins "http://localhost:5173"
      MERCURE_TRUSTED_ISSUERS: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
      ###> dunglas/symfony-docker ###
    depends_on:
      postgres-dev:
        condition: service_healthy
        restart: true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
  postgres-dev:
    image: postgres:18
    container_name: postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - linkx_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_MAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PW}
    ports:
      - "5050:80"

volumes:
  caddy_data:
  caddy_config:
  linkx_postgres:
    name: linkx_postgres
