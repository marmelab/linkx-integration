---
services:
  node-linkx:
    image: node-linkx-integration:prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://node-linkx:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  swagger-ui: # TODO remove after tests
    depends_on:
      - node-linkx
    image: swaggerapi/swagger-ui
    container_name: "swagger-ui-container"
    environment:
      SWAGGER_JSON_URL: "https://linkx-integration.marmelab.com/api/"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
