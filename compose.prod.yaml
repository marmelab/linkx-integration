---
services:
  node-linkx:
    restart: unless-stopped
    image: node-linkx-integration:prod
    environment:
      - BASE_URL=https://${DEFAULT_URI}/api/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://node-linkx:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apk:/apk
      - ./admin:/admin
      - caddy_proxy_data:/data
      - caddy_proxy_config:/config
  php:
    image: frankenphp_prod
    restart: unless-stopped
    env_file: docker-compose.env
    depends_on:
      postgres-dev:
        condition: service_healthy
        restart: true
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      DATABASE_URL: ${DATABASE_URL}
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-http://${DEFAULT_URI:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${CADDY_MERCURE_JWT_ISSUER:-https://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  postgres-dev:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - linkx_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  caddy_data:
  caddy_config:
  caddy_proxy_data:
  caddy_proxy_config:
  linkx_postgres:
    name: linkx_postgres
